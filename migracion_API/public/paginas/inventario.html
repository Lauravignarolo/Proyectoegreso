<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> S.G.R.S.I </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/general.css">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/inventario.css">
    <link rel="stylesheet" href="../assets/css/formularios.css">
</head>

<body id="inicio">
    <header class="HeaderChico">
        <img src="../assets/img/iti utu.png" alt="" height="100px">
        <h1> S.G.R.S.I </h1>
        <a href="tecnico.html">Volver</a>
    </header>
    <nav class="NavBuscar">
        <form class="FormBuscar">
            <fieldset class="FieldsetBuscar">
                <input type="search" name="buscar" placeholder="Buscar...">
                <button type="submit"><i class="bi bi-search"></i></button>
            </fieldset>
        </form>
    </nav>
    <main>
        <section class="SectionInventario">
            <table class="TableInventario">
                <thead>
                    <tr>
                        <th>Componente</th>
                        <th>Marca</th>
                        <th>Stock</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody class="TbodyInventario" id="TbodyInventario">

                </tbody>
            </table>
            <p id="mensajeInventario" role="status"></p>
            <button class="ButtonAgregarComponente" id="ButtonAgregarComponente">Agregar</button>

        </section>
        <dialog class="DialogGestionarInventario">
            <button class="ButtonCerrarGestionarInventario" id="ButtonCerrarGestionarInventario" type="button">
                Cancelar
            </button>
            <form id="FormGestionarInventario">
                <fieldset class="FieldsetInventario">
                    <legend> REGISTRAR NUEVO COMPONENTE </legend>
<label for="Componente">Componente</label>
<input
    class="Inputllenar"
    id="Componente"
    name="componente"
    type="text"
    maxlength="100"
    required
    placeholder="Ingresar componente">

<label for="Marca">Marca</label>
<input
    class="Inputllenar"
    id="Marca"
    name="marca"
    type="text"
    maxlength="100"
    required
    placeholder="Ingresar marca">

<label for="Cantidad">Cantidad</label>
<input
    class="Inputllenar"
    id="Cantidad"
    name="cantidad"
    type="number"
    min="0"
    step="1"
    required
    placeholder="Ingresar cantidad">
                    <button class="ButtonAceptar" type="submit">Aceptar</button>
                </fieldset>
            </form>
        </dialog>
    </main>
    <a href="#inicio" class="ASubir">
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor" class="bi bi-arrow-up-circle"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-7.5 3.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707z" />
        </svg>
    </a>

    <footer>
        <p>&copy; 2026 SGRSI. Todos los derechos reservados.</p>
    </footer>
    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
<script src="../assets/js/constantes.js"></script>
<script src="../assets/js/inventario.js"></script>
</body>

</html>
