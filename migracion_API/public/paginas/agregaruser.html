<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> S.G.R.S.I </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/general.css">
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/formularios.css">
    <link rel="stylesheet" href="../assets/css/administrador.css">
</head>

<body id="inicio">
    <header class="HeaderChico">
        <img src="../assets/img/iti utu.png" alt="" height="100px">
        <h1> S.G.R.S.I </h1>
        <a href="administrador.html">Volver</a>
    </header>
    <main>
        <Section class="SectionFormularioUsuarios">
            <form id="formularioRegistroUsuario">
                <fieldset>
                    <legend> REGISTRAR NUEVO USUARIO </legend>

                    <label for="">Cedula</label>
                    <input class="Inputllenar" type="text" name="cedula" required pattern="[1-9][0-9]{7}" maxlength="8" placeholder="Ingresar Cédula">

                    <label for="">Nombre</label>
                    <input class="Inputllenar" type="text" name="nombre" required placeholder="Ingresar Nombre">


                    <label for="">Apellido</label>
                    <input class="Inputllenar" type="text" name="apellido" required placeholder="Ingresar Apellido">


                    <label for="">Contraseña</label>
                    <input class="Inputllenar" type="password" id="clave"
                        name="clave" required minlength="12"
                        placeholder="Ingresar contraseña">

                    <label for="confirmarClave">Confirmar contraseña</label>
                    <input class="Inputllenar" type="password" id="confirmarClave"
                        name="confirmarClave" required minlength="12"
                        placeholder="Repetir contraseña">

                    <label for="">Tipo de Usuario</label>
                    <select id="turno" name="rol">
                        <option disabled selected>Seleccione un tipo de Usuario</option>
                        <option value="Docente">Docente</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Tecnico">Tecnico</option>
                        <option value="Direccion">Direccion</option>

                    </select>

                    <a href="/public/confirmacionuser.html" class="AEnviar">
                        <button class="ButtonEnviar" type="submit">Enviar</button>
                    </a>

                </fieldset>
            </form>
        </section>

    </main>
    <a href="#inicio" class="ASubir">
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor" class="bi bi-arrow-up-circle"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-7.5 3.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707z" />
        </svg>
    </a>

    <footer>
        <p>&copy; 2026 SGRSI. Todos los derechos reservados.</p>
    </footer>
    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
