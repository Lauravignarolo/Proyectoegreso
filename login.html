<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login S.G.R.S.I </title>

</head>

<body>
    <header class="HeaderInicio">
        <img src="" alt="">
        <h1> Login S.G.R.S.I </h1>

        <nav class="NavLogin">
            <ul class="UlLogin">
                <li><a href=""> <img src="" alt=""> </a></li>
            </ul>
        </nav>
    </header>
    <main>
        <Section class="SectionFormularioLogin">
            <form>
                <fieldset>
                    <legend> Ingresar </legend>

                    <label>Ingrese su Cedula</label>
                    <input class="InputReyenar" type="text" id="cedula" name="cedula" pattern="[1-9][0-9]{7}"
                        title="Ingrese exactamente 8 dígitos sin puntos ni guiones" inputmode="numeric" maxlength="8"
                        required placeholder="Ingrese su cedula">

                    <label>Ingrese su Contraseña</label>
                    <input class="InputReyenar" type="password" minlength="8" title="Ingrese mas de 8 caracteres"
                        required placeholder="Ingrese su contraseña">

                    <a>
                        <button type="submit">Ingresar</button>
                    </a>

                </fieldset>
                
            </form>

        </Section>

    </main>
    <footer>

    </footer>
</body>

</html>
