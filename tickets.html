<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> S.G.R.S.I </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/general.css">
</head>

<body id="inicio">
    <header class="HeaderChico" >
        <img src="assets/img/iti utu.png" alt="" height="100px">
        <h1> S.G.R.S.I </h1>
    </header>
    <main>
        <Section class="SectionFormularioTickets">
            <form>
                <fieldset>
                    <legend> INICIAR SESION </legend>

                    <input class="Inputllenar" type="text" id="cedula" name="cedula" pattern="[1-9][0-9]{7}"
                        title="Ingrese exactamente 8 dígitos sin puntos ni guiones" inputmode="numeric" maxlength="8"
                        required placeholder="Usuario">

                    <input class="Inputllenar" type="password" minlength="8" title="Ingrese mas de 8 caracteres"
                        required placeholder="Contraseña">

                    <a class="AIngresar">
                        <button class="ButtonIngresar" type="submit">INGRESAR</button>
                    </a>

                </fieldset>
                
            </form>
        </section
    </main>
    <a href="#inicio" class="ASubir">
        <img src="assets/img/circulo-de-flecha-hacia-arriba.png" alt="" width="35px">
    </a>

    <footer>
        <p>&copy; 2026 SGRSI. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
