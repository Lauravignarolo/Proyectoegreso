  <main>
        <section class="SectionEquipos">
            <table class="TableEquipos">
    <thead>
        <tr>
            <th>PC</th>
            <th>Salon</th>
            <th>Estado</th>
            <th>Urgencia</th>
            <th>Accion</th>
        </tr>
    </thead>

    <tbody class="TbodyEquipos" id="TbodyEquipos">
        
    </tbody>
</table>
<button class="ButtonAgregarPC" id="ButtonAgregarPC">Agregar</button>

        </section>
        <dialog class="DialogGestionarEquipos">
            <button class="ButtonCerrarGestionarEquipos" id="ButtonCerrarGestionarEquipos" type="button">
                Cancelar
            </button>
            <form id="FormGestionarEquipos">
                <fieldset class="FieldsetEquipos">
                    <legend> REGISTRAR NUEVA PC </legend>

                    <label for="">Pc</label>
                    <input class="Inputllenar" id="Pc" type="text" required placeholder="Ingresar Pc">


                    <label for="">Salon</label>
                    <input class="Inputllenar" id="Salon" type="text" required placeholder="Ingresar Salon">


                    <label for="">Estado</label>
                    <input class="Inputllenar" id="Estado" type="text" required  placeholder="Ingresar Estado">

                    <label for="">Urgencia</label>
                    <select id="Urgencia" name="Urgencia">
                        <option disabled selected>Seleccione un tipo de Usuario</option>
                        <option value="Nula">Nula</option>
                        <option value="Poca">Poca</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>

                    </select>

                        <button class="ButtonAceptar" type="submit">Aceptar</button>
                </fieldset>
            </form>
        </dialog>
